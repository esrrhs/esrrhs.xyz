user  www-data;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  10240;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_min_length  5k;
    gzip_buffers     4 16k;
    gzip_comp_level 3;
    gzip_types       text/plain application/javascript text/css application/xml text/javascript application/json image/svg+xml;
    gzip_vary on;

    include /etc/nginx/conf.d/*.conf;

    # apex -> www
    server {
        listen 80;
        server_name esrrhs.xyz;
        return 301 http://www.esrrhs.xyz$request_uri;
    }

    # 麻将算法
    server {
        listen 80;
        server_name majiang.esrrhs.xyz;

        location / {
            proxy_pass http://127.0.0.1:8888;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # 斗地主 AI
    server {
        listen 80;
        server_name doudizhu.esrrhs.xyz;

        location / {
            proxy_pass http://127.0.0.1:8889;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # 个人主页静态站
    server {
        listen 80 default_server;
        server_name www.esrrhs.xyz _;
        root /home/project/esrrhs.xyz/html;
        index index.html index.htm;
        client_max_body_size 20m;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
